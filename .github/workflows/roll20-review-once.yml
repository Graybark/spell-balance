name: Collect Roll20 proofreading references
on:
  push:
    paths: ['.github/workflows/roll20-review-once.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - name: Read only the matching public reference pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote, urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor
          from bs4 import BeautifulSoup
          import hashlib, json, time
          out=Path('/tmp/roll20-sources');out.mkdir()
          old='Acid Splash|Animate Objects|Antilife Shell|Antimagic Field|Banishment|Bigby\'s Hand|Control Weather|Counterspell|Creation|Cure Wounds|Elemental Weapon|Haste|Magic Weapon|Mass Suggestion|Pass Without Trace|Poison Spray|Reincarnate|Scrying|Shield of Faith|Teleport|Warding Bond'.split('|')
          new='Banishment|Bigby\'s Hand|Blade Barrier|Blink|Call Lightning|Chain Lightning|Chill Touch|Clairvoyance|Conjure Elemental|Control Weather|Create Undead|Creation|Detect Thoughts|Disintegrate|Dispel Evil and Good|Divination|Drawmij\'s Instant Summons|Druidcraft|Earthquake|Gate|Gentle Repose|Giant Insect|Hunger of Hadar|Ice Knife|Incendiary Cloud|Legend Lore|Mass Suggestion|Meld into Stone|Minor Illusion|Mirror Image|Modify Memory|Otiluke\'s Freezing Sphere|Planar Ally|Planar Binding|Produce Flame|Reverse Gravity|Rope Trick|Sacred Flame|Scrying|See Invisibility|Sleep|Sorcerous Burst|Spare the Dying|Starry Wisp|Summon Aberration|Summon Beast|Summon Celestial|Summon Construct|Summon Dragon|Summon Elemental|Summon Fey|Summon Fiend|Sunbeam|Symbol|Thunderclap|Transport Via Plants|Vicious Mockery|Wall of Force|Wall of Ice|Weird|Word of Recall'.split('|')
          jobs=[(n,'2014','https://roll20.net/compendium/dnd5e/'+quote(n)) for n in old]+[(n,'2024','https://roll20.net/compendium/dnd5e/Spells:'+quote(n)+'?expansion=32231') for n in new]
          def read(job):
              name,year,url=job
              item={'name':name,'edition':year,'url':url}
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Spellwright editorial reference check'}),timeout=40) as r:raw=r.read();item['final_url']=r.url;item['status']=r.status
                  soup=BeautifulSoup(raw,'html.parser')
                  item['text']=soup.get_text('\n',strip=True)
                  item['sha256']=hashlib.sha256(raw).hexdigest()
                  item['links']=[{'text':a.get_text(' ',strip=True),'url':urljoin(url,a['href'])} for a in soup.select('a[href]')]
                  filename=year+'-'+''.join(c.lower() if c.isalnum() else '-' for c in name)+'.html'
                  (out/filename).write_bytes(raw);item['snapshot']=filename
                  time.sleep(.3)
              except Exception as e:item['error']=str(e)
              return item
          with ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(read,jobs))
          spirits={'Aberrant Spirit','Bestial Spirit','Celestial Spirit','Construct Spirit','Draconic Spirit','Fey Spirit','Fiendish Spirit'}
          extra={}
          for result in results:
              for link in result.get('links',[]):
                  if link['text'] in spirits and urlparse(link['url']).hostname in ('roll20.net','app.roll20.net'):
                      extra[link['url']]=(link['text'],'2024',link['url'])
          with ThreadPoolExecutor(max_workers=3) as pool:results+=list(pool.map(read,extra.values()))
          (out/'sources.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print([(x['edition'],x['name'],x.get('status'),x.get('error','')) for x in results])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: roll20-sources
          path: /tmp/roll20-sources
          retention-days: 1
