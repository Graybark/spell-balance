name: Check static reference
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: reference-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install build and browser-test tools
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Validate content and reproducible output
        run: |
          python tools/build.py --check
          python tools/verify.py
          node --check src/app.js
      - name: Check first paint, failed scripts, navigation and responsive layout
        run: python tools/browser_test.py
      - name: Save validation report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-reference-validation
          path: /tmp/spell-balance-validation
          retention-days: 7
