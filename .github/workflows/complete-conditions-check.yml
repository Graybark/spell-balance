name: Verify published complete condition references
on:
  push:
    branches: [fix/complete-condition-definitions-20261024]
    paths: [.github/workflows/complete-conditions-check.yml]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2b5352be67fcc5c8cac18953c08e929f8de3bdd7
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing verification tools
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Verify all 30 published definitions and real interactions
        run: |
          python - <<'PY'
          import asyncio,json,re,sys,time
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'tools')
          from conditions_test import check_condition_browser
          base='https://graybark.github.io/spell-balance/'
          expected=Path('index.html').read_bytes()
          for attempt in range(18):
              actual=urlopen(base+'?verify=2b5352be67fcc5c8cac18953c08e929f8de3bdd7',timeout=30).read()
              if actual==expected:break
              time.sleep(10)
          else:raise AssertionError('Published HTML differs from tested commit')
          page=BeautifulSoup(actual,'html.parser')
          for tag in page.select('link[rel=stylesheet],script[src]'):
              path=tag.get('href',tag.get('src'))
              assert urlopen(urljoin(base,path),timeout=30).read()==Path(path).read_bytes(),path
          assert urlopen(urljoin(base,'attribution.html'),timeout=30).read()==Path('attribution.html').read_bytes()
          definitions=BeautifulSoup(page.select_one('#condition-definitions').decode_contents(),'html.parser')
          data=json.loads(Path('data/conditions.json').read_text())
          for name,editions in data.items():
              for year,d in editions.items():
                  section=definitions.select_one('[data-condition-entry="'+name+'"][data-edition="'+year+'"]')
                  assert not section.select('a[href]')
                  assert len(section.select('li'))==len(d['effects'])
                  assert [s.get_text() for s in section.select('li > strong')]==[e['heading'] for e in d['effects'] if e['heading']]
          async def main():
              report=Path('/tmp/spell-balance-validation');report.mkdir(parents=True,exist_ok=True)
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(channel='chrome')
                  await check_condition_browser(browser,base,report)
                  for width in (1280,390):
                      context=await browser.new_context(viewport={'width':width,'height':844},has_touch=width==390,is_mobile=width==390)
                      p=await context.new_page()
                      await p.goto(base+'?label=buff#spell-mordenkainen-s-sword')
                      await p.wait_for_selector('html.enhanced')
                      assert await p.locator('#label').input_value()=='buff'
                      assert await p.locator('.spell-card:visible h2').inner_text()=="Mordenkainen's Sword"
                      assert await p.locator('#spell-mordenkainen-s-sword .tag-buff').inner_text()=='Buff'
                      await p.goto(base+'#spell-web')
                      await p.wait_for_selector('html.enhanced')
                      await p.locator('#spell-web [data-panel=spell] .condition-link[data-condition=restrained]').first.click()
                      modal=p.locator('#condition-dialog')
                      assert await modal.locator('li > strong').all_inner_texts()==['Speed 0.','Attacks Affected.','Saving Throws Affected.']
                      assert await modal.locator('a[href]').count()==0
                      await p.locator('#condition-dialog-close').click()
                      await p.goto(base+'#spell-greater-restoration')
                      await p.wait_for_selector('html.enhanced')
                      await p.locator('label[for="spell-greater-restoration-info-compare"]').click()
                      await p.locator('label[for="spell-greater-restoration-editions-2014"]').click()
                      await p.locator('#spell-greater-restoration [data-panel="2014"] .condition-link[data-condition=exhaustion]').first.click()
                      assert await modal.locator('table tbody tr').count()==6
                      assert await p.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      await p.screenshot(path=str(report/('exhaustion-2014-'+str(width)+'.png')))
                      await context.close()
                  await browser.close()
          asyncio.run(main())
          print('PASS: all 30 published definitions, original bullet counts and bold headings, no popup source links, keyboard/hover/touch, 2014 Exhaustion table and Mordenkainen Sword Buff filter')
          PY
      - name: Save published screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-complete-conditions
          path: /tmp/spell-balance-validation
          retention-days: 7
