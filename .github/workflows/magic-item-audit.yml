name: Inspect two irregular item descriptions
on:
  push:
    branches: [audit/magic-item-index-20261026]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: pip install beautifulsoup4==4.14.3
      - run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from bs4 import BeautifulSoup,SoupStrainer
          for name in ('Bag%20of%20Beans','Deck%20of%20Illusions'):
              url='https://roll20.net/compendium/dnd5e/Items:'+name+'?expansion=33335'
              soup=BeautifulSoup(urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'})).read(),'html.parser')
              print('SOURCE',url)
              body=soup.select_one('.page__body')
              print('BODY',str(body)[:24000])
          PY
