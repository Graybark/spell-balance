name: Validate and build condition overlays
on:
  push:
    branches: [feature/condition-overlays-20261023]
permissions:
  contents: write
jobs:
  conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and check all 391 spells
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python tools/build.py
          python tools/build.py --check
          python tools/verify.py
          node --check src/app.js
      - name: Check responsive, touch, keyboard, and mouse interactions
        run: |
          python -m playwright install --with-deps chromium
          python tools/browser_test.py
      - name: Commit verified generated files to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified spell condition links and overlays'
            git push origin HEAD:feature/condition-overlays-20261023
          fi
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditions-validation
          path: /tmp/spell-balance-validation
          retention-days: 7
