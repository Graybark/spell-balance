name: Verify published Wall of Ice formatting
on:
  push:
    branches: [maintenance/wall-of-ice-paragraphs-20261023]
    paths: [.github/workflows/wall-of-ice-check.yml]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b410c3032a13fd316d4029a5a1ef426eff9ac21
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install browser verification tools
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Verify deployed HTML and paragraph layout
        run: |
          python - <<'PY'
          import asyncio,time
          from pathlib import Path
          from urllib.request import urlopen
          from playwright.async_api import async_playwright
          base='https://graybark.github.io/spell-balance/'
          expected=Path('index.html').read_bytes()
          for attempt in range(18):
              actual=urlopen(base+'?verify=5b410c3032a13fd316d4029a5a1ef426eff9ac21',timeout=30).read()
              if actual==expected:break
              time.sleep(10)
          else:raise AssertionError('Published HTML does not match tested commit')
          async def main():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(channel='chrome')
                  for width in (1280,390,360):
                      page=await browser.new_page(viewport={'width':width,'height':950})
                      errors=[]
                      page.on('pageerror',lambda error:errors.append(str(error)))
                      await page.goto(base+'?verify=5b410c3032a13fd316d4029a5a1ef426eff9ac21#spell-wall-of-ice')
                      await page.wait_for_selector('html.enhanced')
                      card=page.locator('#spell-wall-of-ice')
                      assert await card.locator('[data-panel=spell] .spell-text > p').count()==5
                      assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      await card.locator('label[for="spell-wall-of-ice-info-compare"]').click()
                      for year,count in (('2014',4),('2024',5)):
                          await card.locator('label[for="spell-wall-of-ice-editions-'+year+'"]').click()
                          ps=card.locator('[data-panel="'+year+'"] .spell-text > p')
                          assert await ps.count()==count
                          boxes=[await ps.nth(i).bounding_box() for i in range(count)]
                          assert all(b['y']>=a['y']+a['height']+5 for a,b in zip(boxes,boxes[1:]))
                      assert not errors,errors
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          print('PASS: published HTML exactly matches 5b410c3032a13fd316d4029a5a1ef426eff9ac21; main and comparison paragraphs display correctly at desktop/390/360px; no JavaScript errors')
          PY
