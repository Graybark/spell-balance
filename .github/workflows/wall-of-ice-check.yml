name: Diagnose published condition links
on:
  push:
    branches: [maintenance/wall-of-ice-paragraphs-20261023]
    paths: [.github/workflows/wall-of-ice-check.yml]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b410c3032a13fd316d4029a5a1ef426eff9ac21
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Inspect actual published HTML and assets, mouse hover and touch tap
        run: |
          python - <<'PY'
          import asyncio,json,re,sys
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'tools')
          from conditions_test import check_condition_browser
          base='https://graybark.github.io/spell-balance/'
          raw=urlopen(base,timeout=30).read()
          assert raw==Path('index.html').read_bytes(),'Published HTML differs from current main'
          soup=BeautifulSoup(raw,'html.parser')
          for tag in soup.select('link[rel=stylesheet],script[src]'):
              path=tag.get('href',tag.get('src'))
              assert urlopen(urljoin(base,path),timeout=30).read()==Path(path).read_bytes(),path
          links=soup.select('.condition-link')
          print('LIVE_LINK_COUNT',len(links))
          print('LIVE_LINKS_BY_EDITION',json.dumps({year:len(soup.select('.condition-link[data-edition="'+year+'"]')) for year in ('2014','2024')}))
          for id in ('spell-hold-person','spell-blindness-deafness','spell-web','spell-sleep'):
              print('LIVE_SPELL_LINKS',id,[(a.get_text(),a['data-edition']) for a in soup.select('#'+id+' [data-panel=spell] .condition-link')])
          async def main():
              report=Path('/tmp/spell-balance-validation');report.mkdir(parents=True,exist_ok=True)
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(channel='chrome')
                  await check_condition_browser(browser,base,report)
                  await browser.close()
          asyncio.run(main())
          print('PASS: real published mouse hover, keyboard, touch tap, in-page overlay, both editions, navigation and source links')
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-condition-diagnostics
          path: /tmp/spell-balance-validation
          retention-days: 7
