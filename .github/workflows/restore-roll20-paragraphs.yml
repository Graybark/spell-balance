name: Validate Roll20 paragraph restoration
on:
  push:
    branches: [maintenance/restore-roll20-paragraphs-20261021]
    paths: [.github/workflows/restore-roll20-paragraphs.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests -r requirements-build.txt
      - name: Baseline mechanics and text snapshot
        run: |
          python - <<'PY'
          import json,hashlib
          from bs4 import BeautifulSoup
          xs=json.load(open('data/catalog.json'))
          snapshot={}
          for s in xs:
            for y,v in s['versions'].items():
              snapshot[(s['id'],y)] = (BeautifulSoup(v['body'],'html.parser').get_text(' ',strip=True),{k:q for k,q in v.items() if k not in ('body','body_sha256')})
          import pickle
          with open('/tmp/paragraph-baseline.pkl','wb') as f:pickle.dump(snapshot,f)
          PY
      - name: Compare source paragraph boundaries
        run: python -u tools/restore_roll20_paragraphs.py
      - name: Validate zero spell wording changes and static site
        run: |
          python - <<'PY'
          import json,hashlib,pickle
          from bs4 import BeautifulSoup
          before=pickle.load(open('/tmp/paragraph-baseline.pkl','rb'))
          xs=json.load(open('data/catalog.json'))
          changed=0
          for s in xs:
            for y,v in s['versions'].items():
              old_text,old_metadata=before[(s['id'],y)]
              assert old_text==BeautifulSoup(v['body'],'html.parser').get_text(' ',strip=True),(s['name'],y)
              assert old_metadata=={k:q for k,q in v.items() if k not in ('body','body_sha256')},(s['name'],y)
              assert hashlib.sha256(v['body'].encode()).hexdigest()==v['body_sha256']
          results=json.load(open('/tmp/roll20-paragraph-audit.json'))
          total=sum(x['result']=='updated' for x in results)
          assert total>5, 'No substantial source-supported repairs'
          print('Source-aligned paragraph changes:',total,'of',len(results),'candidates')
          PY
          python tools/build.py && python tools/build.py --check && python tools/verify.py
      - name: Commit staged changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json index.html
          git diff --cached --stat
          git diff --cached --quiet || (git commit -m 'Restore source-matched spell paragraphs without altering mechanics' && git push origin HEAD:maintenance/restore-roll20-paragraphs-20261021)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roll20-paragraph-audit
          path: /tmp/roll20-paragraph-audit.json
          retention-days: 3
