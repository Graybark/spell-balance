name: Verify published condition references
on:
  push:
    branches: [condition-tooltips-20261023]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 367c1d900344246e7bc8b7822726c9c67ab906df
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install browser verification tools
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          google-chrome --version
      - name: Match published HTML and assets to the tested commit
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          base='https://graybark.github.io/spell-balance/'
          actual=urlopen(base+'?verify=367c1d900344246e7bc8b7822726c9c67ab906df',timeout=30).read()
          assert actual==Path('index.html').read_bytes(), 'Published HTML differs from the tested commit'
          soup=BeautifulSoup(actual,'html.parser')
          for tag in soup.select('link[rel=stylesheet],script[src]'):
              path=tag.get('href',tag.get('src'))
              assert urlopen(urljoin(base,path),timeout=30).read()==Path(path).read_bytes(),path
          print('PASS: published HTML and CSS/JS exactly match 367c1d900344246e7bc8b7822726c9c67ab906df')
          PY
      - name: Test real desktop, keyboard, touch and edition interactions on GitHub Pages
        run: |
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from playwright.async_api import async_playwright
          sys.path.insert(0,'tools')
          from conditions_test import check_condition_browser
          async def main():
              report=Path('/tmp/spell-balance-validation');report.mkdir(parents=True,exist_ok=True)
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(channel='chrome')
                  await check_condition_browser(browser,'https://graybark.github.io/spell-balance/',report)
                  await browser.close()
              print(json.dumps({'result':'PASS','published_url':'https://graybark.github.io/spell-balance/','conditions':15,'editions':[2014,2024],'desktop_hover':True,'keyboard':True,'touch_overlay':True,'navigation_cleanup':True}))
          asyncio.run(main())
          PY
      - name: Save published-site screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-condition-verification
          path: /tmp/spell-balance-validation
          retention-days: 7
