name: Reviewed proofreading pass
on:
  push:
    paths: ['.github/workflows/proofread-once.yml']
permissions:
  contents: write
jobs:
  proofread:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REFERENCE_TEST_OUTPUT: /tmp/proofread-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Apply exact reviewed edits to the checked source
        run: |
          python - <<'PY'
          import base64, copy, hashlib, json, zlib
          from pathlib import Path
          from bs4 import BeautifulSoup
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          path=Path('data/catalog.json'); raw=path.read_bytes()
          css=Path('src/app.css'); cssraw=css.read_bytes()
          assert blob(raw)=='4cfa1fd7dbb25a21053ac078a4c7ceb4813b05d7', 'Catalog changed since editorial review; stop.'
          assert blob(cssraw)=='8d673d059bf76127341a72f7a1921697f8da4c95', 'Stylesheet changed since review; stop.'
          original=json.loads(raw); data=copy.deepcopy(original)
          for spell in data:
              for v in spell['versions'].values():
                  assert hashlib.sha256(v['body'].encode()).hexdigest()==v['body_sha256']
          payload='_BE_REPLACED'
          patches=json.loads(zlib.decompress(base64.b64decode(payload)))
          assert len(patches)==244
          for i,year,field,diffs in patches:
              v=data[i]['versions'][year]
              obj,key=(v['metadata'],field.split('/')[1]) if field.startswith('metadata/') else (v,field)
              for start,end,text in reversed(diffs): obj[key]=obj[key][:start]+text+obj[key][end:]
          changes=[]
          for before,after in zip(original,data):
              assert {k:v for k,v in before.items() if k!='versions'}=={k:v for k,v in after.items() if k!='versions'}
              for year,v in after['versions'].items():
                  v['body_sha256']=hashlib.sha256(v['body'].encode()).hexdigest()
                  assert not BeautifulSoup(v['body'],'html.parser').select('p p, p table, p ul, ul > p')
                  old=before['versions'][year]
                  for key in old:
                      if key!='body_sha256' and old[key]!=v[key]:
                          assert key in ('body','metadata','classes')
                          changes.append({'spell':after['name'],'edition':year,'field':key,'before':old[key],'after':v[key]})
          result=(json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode()
          assert hashlib.sha256(result).hexdigest()=='9d45d4e153c488bd024c9824644333a712cab2c313446da96dd0730551daf008'
          assert len(data)==391 and len({c['spell'] for c in changes})==198
          assert len({(c['spell'],c['edition']) for c in changes})==236
          path.write_bytes(result)
          css.write_bytes(cssraw+b'\n/* Source-preserving spell-data tables restored by editorial review. */\n.spell-data-table{width:100%;border-collapse:collapse;margin:12px 0;font-variant-numeric:tabular-nums}\n.spell-data-table caption{text-align:left;font-weight:700;margin-bottom:6px}\n.spell-data-table th,.spell-data-table td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}\n.spell-data-table thead{background:#f1f7f9}\n.spell-data-table tbody th{font-weight:600;width:22%}\n')
          report=Path('/tmp/proofread-validation');report.mkdir(exist_ok=True)
          (report/'source-changes.json').write_text(json.dumps(changes,ensure_ascii=False,indent=2))
          print('Resolved 294 editorial groups and 2 source-label groups; 91 To confirm groups remain.')
          print('Changed 198 spell entries / 236 edition records; catalog blob:',blob(result))
          print('House-rule overrides, class progression, source attribution, tags, IDs and discussion notes unchanged.')
          PY
      - name: Build and verify all source and generated content
        run: |
          python tools/build.py
          python tools/verify.py
          python tools/build.py --check
          python tools/browser_test.py
      - name: Check restored tables at desktop and mobile widths
        run: |
          python - <<'PY'
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from threading import Thread
          from playwright.sync_api import sync_playwright
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory=str(Path.cwd())))
          Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in (1280,390):
                  page=browser.new_page(viewport={'width':width,'height':1000})
                  page.goto(f'http://127.0.0.1:{server.server_port}/index.html')
                  page.wait_for_selector('html.enhanced')
                  for spell,year in [('spell-augury','2024'),('spell-confusion','2014')]:
                      page.select_option('#jump',spell)
                      if year=='2014':
                          page.locator(f'label[for="{spell}-info-compare"]').click()
                          page.locator(f'label[for="{spell}-editions-2014"]').click()
                      table=page.locator(f'#{spell} .spell-data-table:visible')
                      assert table.count()==1
                      assert table.locator('tbody tr').count()==4
                      assert table.locator('thead th').count()==2
                      assert table.evaluate('(t)=>t.scrollWidth<=t.clientWidth+1')
                      page.locator(f'#{spell}').screenshot(path=f'/tmp/proofread-validation/{spell}-{width}.png')
                  page.close()
              browser.close()
          server.shutdown()
          print('Restored Augury 2024 and Confusion 2014 tables pass desktop/mobile checks.')
          PY
      - name: Commit only the reviewed sources and generated page
        run: |
          git diff --exit-code -- data/house-rules.json data/classes.json data/overview.json src/app.js tools
          git add data/catalog.json src/app.css index.html assets
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix audited spelling, punctuation, captions and formatting; preserve uncertain rules'
          git push origin HEAD:main
          git rev-parse HEAD | tee /tmp/proofread-validation/commit.txt
          tar -czf /tmp/proofread-validation/reference.tar.gz data src tools assets index.html *.svg requirements-*.txt README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofread-validation
          path: /tmp/proofread-validation
          retention-days: 7
