name: Check Roll20 paragraph extraction
on:
  push:
    paths: [.github/workflows/probe-roll20-paragraphs.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests,bs4
          for url in ['https://roll20.net/compendium/dnd5e/Spells%3AAnimal%20Shapes?expansion=32231','https://roll20.net/compendium/dnd5e/Animal%20Shapes']:
            try:
              r=requests.get(url,timeout=15,headers={'User-Agent':'Mozilla/5.0'})
              soup=bs4.BeautifulSoup(r.text,'html.parser')
              print('URL',url,'STATUS',r.status_code,'LENGTH',len(r.content),'TITLE',soup.title.get_text() if soup.title else 'no title')
              ps=[(p.get_text(' ',strip=True)[:85],p.get('class'),p.parent.get('class') if p.parent else None) for p in soup.select('p') if len(p.get_text(' ',strip=True))>90]
              print('LONG PARAGRAPHS',len(ps),'SAMPLE',ps[:8])
            except Exception as e:print(type(e).__name__,str(e))
          PY