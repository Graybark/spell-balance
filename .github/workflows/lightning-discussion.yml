name: Validate Lightning Bolt discussion
on:
  push:
    branches: [discussion/lightning-bolt-20261020]
    paths: [.github/workflows/lightning-discussion.yml, .github/prepare-lightning-discussion.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply the missing discussion without changing any rules
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import hashlib,json
          page=BeautifulSoup(Path('index.html').read_text(),'html.parser')
          saved={c['id']:hashlib.sha256(str(c).encode()).hexdigest() for c in page.select('.spell-card') if c['id']!='spell-lightning-bolt'}
          assert len(saved)==390
          Path('/tmp/unrelated-cards.json').write_text(json.dumps(saved))
          PY
          python .github/prepare-lightning-discussion.py
          python tools/build.py
          python tools/build.py --check
          python tools/verify.py
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import hashlib,json
          page=BeautifulSoup(Path('index.html').read_text(),'html.parser')
          actual={c['id']:hashlib.sha256(str(c).encode()).hexdigest() for c in page.select('.spell-card') if c['id']!='spell-lightning-bolt'}
          assert actual==json.loads(Path('/tmp/unrelated-cards.json').read_text()),'An unrelated card changed.'
          PY
      - name: Test sourced Discussion, original editions, house rule and mobile layouts
        run: |
          python -m playwright install --with-deps chromium
          python tools/browser_test.py
      - name: Commit only the four validated reference files to staging
        run: |
          test "$GITHUB_REF_NAME" = discussion/lightning-bolt-20261020
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'data/catalog.json','data/overview.json','tools/nerf_discussions_test.py','index.html'},changed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/catalog.json data/overview.json tools/nerf_discussions_test.py index.html
          git commit -m 'Add Lightning Bolt balance Discussion with linked sources and preserve approved 6d6 house rule'
          git push origin "HEAD:$GITHUB_REF_NAME"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          names=['data/catalog.json','data/overview.json','tools/nerf_discussions_test.py','index.html']
          hashes={}
          for name in names:
              b=Path(name).read_bytes()
              hashes[name]=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          Path('/tmp/spell-balance-validation/release-files.json').write_text(json.dumps(hashes,indent=2))
          print(json.dumps(hashes))
          PY
      - name: Save test report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lightning-discussion-validation
          path: /tmp/spell-balance-validation
          retention-days: 3
