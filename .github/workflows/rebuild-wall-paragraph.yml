name: Publish Wall of Force paragraph correction
on:
  push:
    paths:
      - .github/workflows/rebuild-wall-paragraph.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - name: Check unchanged words and three paragraphs
        run: |
          python - <<'PY'
          import json
          from bs4 import BeautifulSoup
          x=json.load(open('data/house-rules.json'))['spell-wall-of-force']['body_override']
          p=BeautifulSoup(x,'html.parser').find_all('p')
          assert len(p)==3
          assert p[1].get_text().startswith('If the wall cuts through')
          assert 'Dexterity saving throw' in p[1].get_text()
          assert 'Dexterity saving throw' not in p[0].get_text()
          PY
      - run: python tools/build.py && python tools/build.py --check && python tools/verify.py
      - name: Commit generated static HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Render corrected Wall of Force paragraph grouping' && git push)
