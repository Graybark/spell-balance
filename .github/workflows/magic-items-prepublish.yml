name: Import complete 2024 magic item catalog
on:
  push:
    branches: [feature/magic-items-20261026]
    paths: [.github/workflows/magic-items-prepublish.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - name: Import the public SRD text and both complete 2024 indexes
        run: python tools/import_magic_items.py
      - name: Save the source catalog checkpoint
        run: |
          git config user.name "Graybark"
          git config user.email "24878945+Graybark@users.noreply.github.com"
          git add data/magic-items.json
          git commit -m "Import complete 2024 item indexes and openly licensed item descriptions"
          git push origin HEAD:feature/magic-items-20261026
