name: Verify final published magic item HTML
on:
  push:
    branches: [feature/magic-items-20261026]
    paths: [.github/workflows/magic-items-prepublish.yml]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9522a8540ad3b54449c0433ef1cb75e2bbb8113e
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the browser checks
        run: |
          python -m pip install -r requirements-build.txt
      - name: Verify exact published HTML and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          import time,hashlib
          base='https://graybark.github.io/spell-balance/'
          expected=Path('index.html').read_bytes()
          assert b'Roll20 Note:' not in expected
          for attempt in range(40):
              try:
                  actual=urlopen(Request(base+'?release=9522a8540ad3b54449c0433ef1cb75e2bbb8113e',headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'}),timeout=30).read()
                  if actual==expected:break
              except Exception:pass
              time.sleep(10)
          else:raise AssertionError('GitHub Pages does not yet serve the exact released HTML')
          soup=BeautifulSoup(expected,'html.parser')
          urls=[soup.select_one('link[rel=stylesheet]')['href'],soup.select_one('script[src]')['src'],'attribution.html']
          for path in urls:
              assert urlopen(urljoin(base,path),timeout=30).read()==Path(path).read_bytes(),path
          print('PASS exact published HTML/assets',hashlib.sha256(expected).hexdigest(),len(soup.select('.magic-item-card')),'magic item cards')
          PY
