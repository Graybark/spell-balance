name: Validate 2024 magic item section
on:
  push:
    branches: [feature/magic-items-20261026]
    paths: [.github/workflows/magic-items-prepublish.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing build and browser test tools
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Complete and verify the cached source import
        run: python tools/import_magic_items.py
      - name: Save the completed catalog checkpoint
        if: always()
        run: |
          git config user.name "Graybark"
          git config user.email "24878945+Graybark@users.noreply.github.com"
          git add -f data/magic-items*.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete checked 2024 item catalog snapshot"
            git push origin HEAD:feature/magic-items-20261026
          fi
      - name: Build and validate complete static content
        run: |
          python tools/build.py
          python tools/build.py --check
          python tools/verify.py
          node --check src/app.js
      - name: Verify unchanged spells, slots, condition definitions and house rules
        run: |
          git fetch --depth=1 origin 2b5352be67fcc5c8cac18953c08e929f8de3bdd7
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from bs4 import BeautifulSoup
          base='2b5352be67fcc5c8cac18953c08e929f8de3bdd7'
          before=BeautifulSoup(subprocess.check_output(['git','show',base+':index.html']),'html.parser')
          after=BeautifulSoup(Path('index.html').read_text(),'html.parser')
          for id in ('spells','spell-slots','condition-definitions'):
              assert str(before.find(id=id))==str(after.find(id=id)),id+' changed'
          for file in ('data/catalog.json','data/house-rules.json','data/classes.json','data/conditions.json'):
              assert subprocess.check_output(['git','show',base+':'+file])==Path(file).read_bytes(),file
          print('PASS: all 391 spell cards, original paragraphs, class tables, house rules and condition definitions unchanged')
          PY
      - name: Check all desktop, touch, history, filters and native fallbacks
        run: python tools/browser_test.py
      - name: Save validation screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: magic-items-validation
          path: /tmp/spell-balance-validation
          retention-days: 7
      - name: Commit tested generated HTML and browser assets
        run: |
          git config user.name "Graybark"
          git config user.email "24878945+Graybark@users.noreply.github.com"
          git add index.html assets
          git commit -m "Generate separate searchable magic item section"
          git push origin HEAD:feature/magic-items-20261026
