name: Verify published magic items
on:
  push:
    branches: [feature/magic-items-20261026]
    paths: [.github/workflows/magic-items-prepublish.yml]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c64d89296902a6e398095d922a3d9fb54d9c6963
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the browser checks
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Verify exact published HTML and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          import time,hashlib
          base='https://graybark.github.io/spell-balance/'
          expected=Path('index.html').read_bytes()
          for attempt in range(40):
              try:
                  actual=urlopen(Request(base+'?release=c64d89296902a6e398095d922a3d9fb54d9c6963',headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'}),timeout=30).read()
                  if actual==expected:break
              except Exception:pass
              time.sleep(10)
          else:raise AssertionError('GitHub Pages does not yet serve the exact released HTML')
          soup=BeautifulSoup(expected,'html.parser')
          urls=[soup.select_one('link[rel=stylesheet]')['href'],soup.select_one('script[src]')['src'],'attribution.html']
          for path in urls:
              assert urlopen(urljoin(base,path),timeout=30).read()==Path(path).read_bytes(),path
          print('PASS exact published HTML/assets',hashlib.sha256(expected).hexdigest(),len(soup.select('.magic-item-card')),'magic item cards')
          PY
      - name: Verify live desktop, mobile, history, filters and no-script navigation
        run: |
          python - <<'PY'
          import asyncio,sys,json
          from pathlib import Path
          sys.path.insert(0,'tools')
          from playwright.async_api import async_playwright
          from magic_items_test import check_item_browser
          async def main():
              report=Path('/tmp/spell-balance-validation');report.mkdir(parents=True,exist_ok=True)
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  await check_item_browser(browser,'https://graybark.github.io/spell-balance/',report)
                  await browser.close()
              print(json.dumps({'result':'PASS','published_commit':'c64d89296902a6e398095d922a3d9fb54d9c6963','desktop_and_phone_widths':[1280,390,320],'item_search_filters':True,'condition_dialog':True,'native_no_js_navigation':True,'spells_preserved':True}))
          asyncio.run(main())
          PY
      - name: Save published screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-magic-items-validation
          path: /tmp/spell-balance-validation
          retention-days: 7
