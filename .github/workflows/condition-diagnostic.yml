name: Diagnose condition preview
on:
  push:
    paths: [.github/workflows/condition-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python tools/build.py
          python -m playwright install chromium
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1280,'height':900})
                  page.on('pageerror', lambda e: print('PAGE ERROR:',e))
                  await page.goto(Path('index.html').resolve().as_uri()+'#spell-hold-person')
                  await page.wait_for_selector('html.enhanced')
                  a=page.locator('#spell-hold-person [data-panel="spell"] .condition-link').first
                  print('ANCHOR',await a.evaluate('(el)=>el.outerHTML'))
                  print('REFERENCE',await page.locator('#condition-definitions').evaluate('(el)=>el.content.querySelector(\'[data-condition-entry="paralyzed"][data-edition="2024"]\')?.outerHTML'))
                  await a.hover()
                  tip=page.locator('#condition-tooltip')
                  print('TIP CONTENT',repr(await tip.inner_text()),'HTML',await tip.inner_html())
                  print('EDITION VISIBLE',await tip.locator('.condition-edition').is_visible())
                  await browser.close()
          asyncio.run(main())
          PY
