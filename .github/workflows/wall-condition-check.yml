name: Validate capitalized Invisible condition references
on:
  push:
    branches: [fix/wall-of-force-invisible-link-20261023]
    paths: [.github/workflows/wall-condition-check.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing validation tools
        run: |
          python -m pip install -r requirements-build.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Build and validate unchanged spell wording
        run: |
          python tools/build.py
          python tools/build.py --check
          python tools/verify.py
          node --check src/app.js
          git diff --exit-code -- data/catalog.json data/house-rules.json
      - name: Check desktop, touch, both editions and house-rule mode
        run: python tools/browser_test.py
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wall-condition-validation
          path: /tmp/spell-balance-validation
          retention-days: 7
      - name: Commit generated HTML to this branch
        run: |
          git config user.name "Graybark"
          git config user.email "24878945+Graybark@users.noreply.github.com"
          git add index.html
          git commit -m "Regenerate Wall of Force condition references"
          git push origin HEAD:fix/wall-of-force-invisible-link-20261023
