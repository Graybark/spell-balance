name: Verify published Invisible condition references
on:
  push:
    branches: [fix/wall-of-force-invisible-link-20261023]
    paths: [.github/workflows/wall-condition-check.yml]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 95facf87218124d29140ecb6a38eb17efd4c785a
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Check published HTML, both editions, hover, keyboard and touch
        run: |
          python - <<'PY'
          import asyncio,sys,time
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'tools')
          from conditions_test import check_condition_browser
          base='https://graybark.github.io/spell-balance/'
          expected=Path('index.html').read_bytes()
          for attempt in range(18):
              actual=urlopen(base+'?verify=95facf87218124d29140ecb6a38eb17efd4c785a',timeout=30).read()
              if actual==expected:break
              time.sleep(10)
          else:raise AssertionError('Published HTML differs from tested commit')
          soup=BeautifulSoup(actual,'html.parser')
          for tag in soup.select('link[rel=stylesheet],script[src]'):
              path=tag.get('href',tag.get('src'))
              assert urlopen(urljoin(base,path),timeout=30).read()==Path(path).read_bytes(),path
          for id in ('wall-of-force','arcane-eye','clairvoyance','drawmij-s-instant-summons'):
              assert soup.select_one('#spell-'+id+' [data-panel=spell] .condition-link[data-condition=invisible]')
          wall=soup.select_one('#spell-wall-of-force')
          assert len(wall.select('[data-panel=spell] [data-mode=house] .spell-text > p'))==3
          ice=soup.select_one('#spell-wall-of-ice')
          assert len(ice.select('[data-panel=spell] .spell-text > p'))==5
          assert len(ice.select('[data-panel="2014"] .spell-text > p'))==4
          async def main():
              report=Path('/tmp/spell-balance-validation');report.mkdir(parents=True,exist_ok=True)
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(channel='chrome')
                  await check_condition_browser(browser,base,report)
                  phone=await browser.new_context(viewport={'width':390,'height':844},has_touch=True,is_mobile=True)
                  page=await phone.new_page()
                  await page.goto(base+'#spell-wall-of-force')
                  await page.wait_for_selector('html.enhanced')
                  trigger=page.locator('#spell-wall-of-force [data-panel=spell] .condition-link[data-condition=invisible]:visible')
                  address=page.url
                  await trigger.tap()
                  assert await page.locator('#condition-dialog').is_visible()
                  assert await page.locator('#condition-dialog-title').inner_text()=='Invisible'
                  assert address==page.url
                  await page.locator('#condition-dialog-close').tap()
                  assert not await page.locator('#condition-dialog').is_visible()
                  await phone.close()
                  await browser.close()
          asyncio.run(main())
          print('PASS: published Invisible links, both editions and house-rule modes; desktop and actual touch; all original paragraph corrections retained')
          PY
